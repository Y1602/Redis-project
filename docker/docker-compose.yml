services:
  redis:
    image: redis:latest
    container_name: accessguard-redis
    ports:
      - 6380:6379
    command: redis-server --requirepass redispwd
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redispwd", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: accessguard-nginx
    volumes:
      - ./logs:/var/log/nginx
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - 80:80
    depends_on:
      web:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile_Web
    image: accessguard-web:1.0
    container_name: accessguard-web
    expose:
      - 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 20

  mysql:
    image: mysql:latest
    container_name: accessguard-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: accessguard
    ports:
      - 3306:3306
    volumes:
      - ./mysql_data:/var/lib/mysql
      - ./mysql_init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  accessguard:
    build:
      context: .
      dockerfile: Dockerfile
    image: accessguard:1.0
    container_name: accessguard-app
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redispwd
      REDIS_DB: 0
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: 123456
      MYSQL_DB: accessguard
    ports:
      - 5000:5000
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      nginx:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 20

  log-forwarder:
    build:
      context: .
      dockerfile: Dockerfile_Log
    image: log-forwarder:latest
    container_name: accessguard-log-forwarder
    environment:
      ACCESSGUARD_URL: http://accessguard-app:5000/logs/ingest
      NGINX_LOG_PATH: /logs/access.log
      SLEEP_INTERVAL: 1
    volumes:
      - ./logs:/logs
    depends_on:
      accessguard:
        condition: service_healthy
      nginx:
        condition: service_started

