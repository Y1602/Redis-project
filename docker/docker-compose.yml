services:
  redis:
    image: redis:latest
    container_name: accessguard-redis
    ports:
      - 6380:6379
    command: redis-server --requirepass redispwd
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: accessguard-nginx
    volumes:
      - ./logs:/var/log/nginx
    ports:
      - 80:80

  mysql:
    image: mysql:latest
    container_name: accessguard-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: accessguard
    ports:
      - 3306:3306
    volumes:
      - ./mysql_data:/var/lib/mysql
    restart: unless-stopped

  accessguard:
    image: accessguard:1.0
    container_name: accessguard-app
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redispwd
      REDIS_DB: 0
    ports:
      - 5000:5000
    depends_on:
      - redis
      - nginx

  log-forwarder:
    image: log-forwarder:latest
    container_name: accessguard-log-forwarder
    environment:
      ACCESSGUARD_URL: http://accessguard-app:5000/logs/ingest
      NGINX_LOG_PATH: /logs/access.log
      SLEEP_INTERVAL: 1
    volumes:
      - ./logs:/logs
    depends_on:
      - accessguard
      - nginx

